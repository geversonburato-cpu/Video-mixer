<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">

<title>Video Mixer</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#080d18;
color:#fff;
font-family:Arial,sans-serif;
}

.app{
max-width:700px;
margin:auto;
padding:20px 15px 40px;
}

h1{
margin:0 0 6px;
font-size:28px;
}

.subtitle{
color:#9ca9c3;
margin-bottom:20px;
}

.card{
background:#111a2c;
border:1px solid #27334d;
border-radius:16px;
padding:16px;
margin:12px 0;
}

h3{
margin-top:0;
}

.drop{
display:block;
padding:18px;
text-align:center;
border:1px dashed #596987;
border-radius:12px;
background:#0d1423;
cursor:pointer;
font-weight:bold;
}

.drop input{
display:none;
}

.file{
font-size:12px;
background:#19243a;
padding:9px;
margin-top:6px;
border-radius:8px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.count{
font-size:22px;
font-weight:bold;
}

select,
button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:15px;
font-weight:bold;
}

select{
background:#19243a;
color:#fff;
border:1px solid #3b4965;
}

button{
background:#6d5dfc;
color:#fff;
border:0;
}

button:disabled{
opacity:.5;
}

.progress{
height:9px;
background:#202b43;
border-radius:20px;
overflow:hidden;
margin-top:14px;
}

.bar{
height:100%;
width:0%;
background:#6d5dfc;
transition:width .2s;
}

.status{
font-size:13px;
color:#adb8ce;
line-height:1.5;
}

.links a{
display:block;
padding:11px 0;
color:#bdb8ff;
border-bottom:1px solid #27334d;
text-decoration:none;
}
</style>
</head>

<body>

<div class="app">

<h1>🎬 Video Mixer</h1>

<div class="subtitle">
Monte seus criativos juntando Gancho + Desenvolvimento + CTA.
</div>

<div class="card">

<h3>1 — Gancho</h3>

<label class="drop">

＋ ESCOLHER VÍDEOS

<input
id="p1"
type="file"
accept="video/*"
multiple
>

</label>

<div id="f1"></div>

</div>


<div class="card">

<h3>2 — Desenvolvimento</h3>

<label class="drop">

＋ ESCOLHER VÍDEOS

<input
id="p2"
type="file"
accept="video/*"
multiple
>

</label>

<div id="f2"></div>

</div>


<div class="card">

<h3>3 — CTA</h3>

<label class="drop">

＋ ESCOLHER VÍDEOS

<input
id="p3"
type="file"
accept="video/*"
multiple
>

</label>

<div id="f3"></div>

</div>


<div class="card">

<div
class="count"
id="count"
>
0 combinações
</div>

<select id="limit">

<option value="1">
TESTE — 1 vídeo
</option>

<option value="10">
10 vídeos
</option>

<option value="30">
30 vídeos
</option>

</select>

<button id="generate">

🔥 GERAR CRIATIVOS

</button>

<div class="progress">

<div
id="bar"
class="bar"
></div>

</div>

<p
id="status"
class="status"
>
Escolha um vídeo em cada etapa.
</p>

</div>


<div class="card">

<h3>Vídeos gerados</h3>

<div id="links">

<span class="status">
Nenhum vídeo gerado.
</span>

</div>

</div>

</div>
<script>

const partes = [[], [], []];

const $ = id => document.getElementById(id);


// ===============================
// SELEÇÃO DOS VÍDEOS
// ===============================

[1, 2, 3].forEach(numero => {

  $("p" + numero).addEventListener("change", evento => {

    partes[numero - 1] = [...evento.target.files];

    $("f" + numero).innerHTML =
      partes[numero - 1]
        .map((arquivo, indice) =>
          `<div class="file">
            ${indice + 1}. ${arquivo.name}
          </div>`
        )
        .join("");

    atualizarContador();

  });

});


// ===============================
// CONTADOR
// ===============================

function atualizarContador() {

  const total =
    partes[0].length *
    partes[1].length *
    partes[2].length;

  $("count").textContent =
    total.toLocaleString("pt-BR") +
    " combinações";

}


// ===============================
// CRIAR COMBINAÇÕES
// ===============================

function criarCombinacoes() {

  const resultado = [];

  for (const gancho of partes[0]) {

    for (const desenvolvimento of partes[1]) {

      for (const cta of partes[2]) {

        resultado.push([
          gancho,
          desenvolvimento,
          cta
        ]);

      }

    }

  }

  return resultado.sort(
    () => Math.random() - 0.5
  );

}


// ===============================
// CARREGAR VÍDEO
// ===============================

function carregarVideo(arquivo) {

  return new Promise((resolve, reject) => {

    const video =
      document.createElement("video");

    video.preload = "auto";
    video.muted = false;
    video.playsInline = true;

    const url =
      URL.createObjectURL(arquivo);

    video.src = url;

    video.onloadedmetadata = () => {

      resolve({
        video: video,
        url: url
      });

    };

    video.onerror = () => {

      URL.revokeObjectURL(url);

      reject(
        new Error(
          "Não foi possível abrir o vídeo: " +
          arquivo.name
        )
      );

    };

  });

}


// ===============================
// FORMATO DE GRAVAÇÃO
// ===============================

function escolherFormato() {

  const formatos = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];

  for (const formato of formatos) {

    if (
      MediaRecorder.isTypeSupported(formato)
    ) {

      return formato;

    }

  }

  return "";

}


// ===============================
// GRAVAR UM CRIATIVO
// ===============================

async function gravarCriativo(
  arquivos,
  numero
) {

  $("status").textContent =
    "Preparando criativo " +
    numero +
    "...";


  const videos = [];

  try {

    for (const arquivo of arquivos) {

      videos.push(
        await carregarVideo(arquivo)
      );

    }


    // ===========================
    // CANVAS VERTICAL
    // ===========================

    const canvas =
      document.createElement("canvas");

    canvas.width = 1080;
    canvas.height = 1920;

    const contexto =
      canvas.getContext("2d");


    // ===========================
    // STREAM DO CANVAS
    // ===========================

    const stream =
      canvas.captureStream(30);


    // ===========================
    // ÁUDIO
    // ===========================

    let audioContext = null;
    let audioDestino = null;

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      audioContext =
        new AudioContext();

      audioDestino =
        audioContext.createMediaStreamDestination();

      for (const item of videos) {

        const fonte =
          audioContext.createMediaElementSource(
            item.video
          );

        fonte.connect(
          audioDestino
        );

      }

      const trilhas =
        audioDestino.stream.getAudioTracks();

      for (const trilha of trilhas) {

        stream.addTrack(trilha);

      }

    } catch (erroAudio) {

      console.log(
        "Áudio não disponível:",
        erroAudio
      );

    }


    // ===========================
    // VERIFICAR MEDIA RECORDER
    // ===========================

    const formato =
      escolherFormato();

    if (!formato) {

      throw new Error(
        "Seu navegador não suporta a gravação de vídeo necessária."
      );

    }


    const gravador =
      new MediaRecorder(
        stream,
        {
          mimeType: formato,
          videoBitsPerSecond: 7000000
        }
      );


    const partesGravadas = [];


    gravador.ondataavailable =
      evento => {

        if (
          evento.data &&
          evento.data.size > 0
        ) {

          partesGravadas.push(
            evento.data
          );

        }

      };


    const finalizado =
      new Promise((resolve, reject) => {

        gravador.onstop =
          () => resolve();

        gravador.onerror =
          () =>
            reject(
              new Error(
                "Erro durante a gravação."
              )
            );

      });


    // ===========================
    // COMEÇAR GRAVAÇÃO
    // ===========================

    gravador.start(1000);


    // ===========================
    // PROCESSAR 3 PARTES
    // ===========================

    for (
      let parte = 0;
      parte < videos.length;
      parte++
    ) {

      const item =
        videos[parte];

      const video =
        item.video;


      video.currentTime = 0;


      await new Promise(resolve => {

        if (video.readyState >= 2) {

          resolve();

        } else {

          video.oncanplay =
            () => resolve();

        }

      });


      $("status").textContent =
        "Criativo " +
        numero +
        " — parte " +
        (parte + 1) +
        " de 3";


      await video.play();


      while (!video.ended) {

        const largura =
          video.videoWidth;

        const altura =
          video.videoHeight;


        const proporcaoVideo =
          largura / altura;

        const proporcaoCanvas =
          1080 / 1920;


        let larguraFinal;
        let alturaFinal;
        let x;
        let y;


        if (
          proporcaoVideo >
          proporcaoCanvas
        ) {

          alturaFinal =
            1920;

          larguraFinal =
            alturaFinal *
            proporcaoVideo;

          x =
            (1080 -
              larguraFinal) / 2;

          y = 0;

        } else {

          larguraFinal =
            1080;

          alturaFinal =
            larguraFinal /
            proporcaoVideo;

          x = 0;

          y =
            (1920 -
              alturaFinal) / 2;

        }


        contexto.fillStyle =
          "#000";

        contexto.fillRect(
          0,
          0,
          1080,
          1920
        );


        contexto.drawImage(
          video,
          x,
          y,
          larguraFinal,
          alturaFinal
        );


        await new Promise(
          resolve =>
            requestAnimationFrame(
              resolve
            )
        );

      }


      video.pause();

    }


    // ===========================
    // ENCERRAR GRAVAÇÃO
    // ===========================

    gravador.stop();

    await finalizado;


    if (audioContext) {

      try {

        await audioContext.close();

      } catch (e) {}

    }


    // ===========================
    // LIMPAR VÍDEOS
    // ===========================

    for (const item of videos) {

      item.video.pause();

      URL.revokeObjectURL(
        item.url
      );

    }


    // ===========================
    // CRIAR ARQUIVO
    // ===========================

    return new Blob(
      partesGravadas,
      {
        type: formato
      }
    );

  } catch (erro) {

    for (const item of videos) {

      try {

        item.video.pause();

        URL.revokeObjectURL(
          item.url
        );

      } catch (e) {}

    }

    throw erro;

  }

}


// ===============================
// BOTÃO GERAR
// ===============================

$("generate").addEventListener(
  "click",
  async () => {

    if (
      partes[0].length === 0 ||
      partes[1].length === 0 ||
      partes[2].length === 0
    ) {

      alert(
        "Escolha pelo menos 1 vídeo em cada etapa."
      );

      return;

    }


    $("generate").disabled =
      true;

    $("links").innerHTML =
      "";


    $("bar").style.width =
      "0%";


    try {

      const todas =
        criarCombinacoes();


      const limite =
        Number(
          $("limit").value
        );


      const combinacoes =
        todas.slice(
          0,
          limite
        );


      for (
        let i = 0;
        i < combinacoes.length;
        i++
      ) {

        const blob =
          await gravarCriativo(
            combinacoes[i],
            i + 1
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement("a");


        link.href =
          url;


        link.download =
          "criativo_" +
          String(i + 1)
            .padStart(3, "0") +
          ".webm";


        link.textContent =
          "⬇️ Baixar criativo " +
          String(i + 1)
            .padStart(3, "0");


        $("links")
          .appendChild(link);


        $("bar").style.width =
          (
            ((i + 1) /
            combinacoes.length) *
            100
          ) +
          "%";

      }


      $("status").textContent =
        "✅ Concluído! " +
        combinacoes.length +
        " criativo(s) gerado(s).";


    } catch (erro) {

      console.error(erro);


      $("status").textContent =
        "❌ ERRO: " +
        (
          erro.message ||
          erro
        );

    }


    $("generate").disabled =
      false;

  }
);

</script>
