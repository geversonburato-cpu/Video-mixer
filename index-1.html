<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>Video Mixer</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080d18;
color:#fff;
font-family:Arial,sans-serif;
}

.app{
max-width:700px;
margin:auto;
padding:20px 15px 40px;
}

h1{
margin:0 0 5px;
}

p{
color:#9ca9c3;
}

.card{
background:#111a2c;
border:1px solid #27334d;
border-radius:16px;
padding:16px;
margin:12px 0;
}

.drop{
display:block;
padding:18px;
text-align:center;
border:1px dashed #596987;
border-radius:12px;
background:#0d1423;
}

.drop input{
display:none;
}

.file{
font-size:12px;
background:#19243a;
padding:8px;
margin-top:5px;
border-radius:7px;
}

button,select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:0;
font-size:15px;
font-weight:bold;
}

button{
background:#6d5dfc;
color:white;
}

.status{
font-size:13px;
}

#links a{
display:block;
padding:10px 0;
color:#bdb8ff;
}
</style>
</head>

<body>

<div class="app">

<h1>🎬 Video Mixer</h1>

<p>Monte vários criativos juntando Gancho + Desenvolvimento + CTA.</p>

<div class="card">

<h3>1 — Gancho</h3>

<label class="drop">
ESCOLHER VÍDEOS
<input id="p1" type="file" accept="video/*" multiple>
</label>

<div id="f1"></div>

</div>

<div class="card">

<h3>2 — Desenvolvimento</h3>

<label class="drop">
ESCOLHER VÍDEOS
<input id="p2" type="file" accept="video/*" multiple>
</label>

<div id="f2"></div>

</div>

<div class="card">

<h3>3 — CTA</h3>

<label class="drop">
ESCOLHER VÍDEOS
<input id="p3" type="file" accept="video/*" multiple>
</label>

<div id="f3"></div>

</div>

<div class="card">

<div id="count">0 combinações</div>

<select id="limit">

<option value="1">TESTE — 1 vídeo</option>

<option value="10">10 vídeos</option>

<option value="30">30 vídeos</option>

</select>

<button id="generate">
🔥 GERAR CRIATIVOS
</button>

<p id="status">
Escolha um vídeo em cada etapa.
</p>

<div id="links"></div>

</div>

</div>

<script type="module">

const partes = [[], [], []];

const $ = id => document.getElementById(id);

let ffmpeg = null;
let fetchFile = null;


// ===============================
// SELEÇÃO DOS VÍDEOS
// ===============================

[1,2,3].forEach(numero => {

  $("p" + numero).addEventListener("change", evento => {

    partes[numero - 1] = [...evento.target.files];

    $("f" + numero).innerHTML =
      partes[numero - 1]
      .map((arquivo, indice) =>
        `<div class="file">${indice + 1}. ${arquivo.name}</div>`
      )
      .join("");

    atualizarQuantidade();

  });

});


// ===============================
// CONTADOR DE COMBINAÇÕES
// ===============================

function atualizarQuantidade(){

  const total =
    partes[0].length *
    partes[1].length *
    partes[2].length;

  $("count").textContent =
    total.toLocaleString("pt-BR") +
    " combinações";

}


// ===============================
// CARREGAR FFMPEG
// ===============================

async function carregarFFmpeg(){

  if(ffmpeg) return;

  $("status").textContent =
    "Carregando o motor de vídeo... aguarde.";

  const moduloFFmpeg =
    await import(
      "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/+esm"
    );

  const moduloUtil =
    await import(
      "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/+esm"
    );

  const FFmpeg = moduloFFmpeg.FFmpeg;

  fetchFile = moduloUtil.fetchFile;

  const toBlobURL = moduloUtil.toBlobURL;

  ffmpeg = new FFmpeg();


  // =====================================
  // IMPORTANTE:
  // MODO SINGLE-THREAD
  // SEM workerURL
  // =====================================

  const base =
    "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


  const coreURL =
    await toBlobURL(
      base + "/ffmpeg-core.js",
      "text/javascript"
    );


  const wasmURL =
    await toBlobURL(
      base + "/ffmpeg-core.wasm",
      "application/wasm"
    );


  await ffmpeg.load({

    coreURL: coreURL,

    wasmURL: wasmURL

  });


  $("status").textContent =
    "Motor de vídeo carregado.";

}


// ===============================
// GERAR COMBINAÇÕES
// ===============================

function gerarCombinacoes(){

  const resultado = [];

  for(const gancho of partes[0]){

    for(const desenvolvimento of partes[1]){

      for(const cta of partes[2]){

        resultado.push([
          gancho,
          desenvolvimento,
          cta
        ]);

      }

    }

  }

  return resultado;

}


// ===============================
// APAGAR ARQUIVO TEMPORÁRIO
// ===============================

async function apagar(nome){

  try{

    await ffmpeg.deleteFile(nome);

  }catch(e){}

}


// ===============================
// GERAR VÍDEOS
// ===============================

$("generate").addEventListener(
  "click",
  async () => {

    if(
      partes[0].length === 0 ||
      partes[1].length === 0 ||
      partes[2].length === 0
    ){

      alert(
        "Escolha pelo menos 1 vídeo em cada etapa."
      );

      return;

    }


    $("generate").disabled = true;

    $("links").innerHTML = "";


    try{

      await carregarFFmpeg();


      const todas =
        gerarCombinacoes();


      const limite =
        Number(
          $("limit").value
        );


      const combinacoes =
        todas.slice(0, limite);


      for(
        let i = 0;
        i < combinacoes.length;
        i++
      ){

        const gancho =
          combinacoes[i][0];

        const desenvolvimento =
          combinacoes[i][1];

        const cta =
          combinacoes[i][2];


        $("status").textContent =
          "Processando vídeo " +
          (i + 1) +
          " de " +
          combinacoes.length +
          "...";


        await apagar("gancho.mp4");
        await apagar("desenvolvimento.mp4");
        await apagar("cta.mp4");
        await apagar("lista.txt");
        await apagar("final.mp4");


        await ffmpeg.writeFile(
          "gancho.mp4",
          await fetchFile(gancho)
        );


        await ffmpeg.writeFile(
          "desenvolvimento.mp4",
          await fetchFile(desenvolvimento)
        );


        await ffmpeg.writeFile(
          "cta.mp4",
          await fetchFile(cta)
        );


        // =================================
        // NORMALIZAÇÃO DOS 3 VÍDEOS
        // =================================

        const arquivos = [
          ["gancho.mp4", "gancho.ts"],
          ["desenvolvimento.mp4", "desenvolvimento.ts"],
          ["cta.mp4", "cta.ts"]
        ];


        for(
          const [entrada, saida]
          of arquivos
        ){

          await apagar(saida);


          const retorno =
            await ffmpeg.exec([

              "-i",
              entrada,

              "-vf",
              "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2",

              "-r",
              "30",

              "-c:v",
              "libx264",

              "-preset",
              "ultrafast",

              "-crf",
              "26",

              "-c:a",
              "aac",

              "-b:a",
              "128k",

              "-f",
              "mpegts",

              "-y",

              saida

            ]);


          if(retorno !== 0){

            throw new Error(
              "Erro ao preparar o vídeo."
            );

          }

        }


        // =================================
        // LISTA PARA CONCATENAÇÃO
        // =================================

        const lista =
          "file 'gancho.ts'\n" +
          "file 'desenvolvimento.ts'\n" +
          "file 'cta.ts'\n";


        await ffmpeg.writeFile(
          "lista.txt",
          new TextEncoder().encode(lista)
        );


        // =================================
        // UNIR OS 3 VÍDEOS
        // =================================

        const retornoFinal =
          await ffmpeg.exec([

            "-f",
            "concat",

            "-safe",
            "0",

            "-i",
            "lista.txt",

            "-c",
            "copy",

            "-movflags",
            "+faststart",

            "-y",

            "final.mp4"

          ]);


        if(retornoFinal !== 0){

          throw new Error(
            "Erro ao unir os vídeos."
          );

        }


        // =================================
        // DISPONIBILIZAR DOWNLOAD
        // =================================

        const dados =
          await ffmpeg.readFile(
            "final.mp4"
          );


        const blob =
          new Blob(
            [dados.buffer],
            {
              type:"video/mp4"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const nome =
          "criativo_" +
          String(i + 1)
          .padStart(3,"0") +
          ".mp4";


        const link =
          document.createElement(
            "a"
          );


        link.href = url;

        link.download = nome;

        link.textContent =
          "⬇️ Baixar " + nome;


        $("links")
          .appendChild(link);

      }


      $("status").textContent =
        "✅ Pronto! " +
        combinacoes.length +
        " vídeo(s) gerado(s).";


    }catch(erro){

      console.error(erro);


      $("status").textContent =
        "❌ ERRO: " +
        (
          erro.message ||
          erro
        );

    }


    $("generate").disabled =
      false;

  }
);

 </script>
