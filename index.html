<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080d18;

max-width:700px;

select{

<body>

<div class="app">

<h1>🎬 Video Mixer v3</h1>

<div class="subtitle">
Gancho + Desenvolvimento + CTA.
</div>

<div class="card">

<h3>1 — Gancho</h3>

<label class="drop">

＋ ESCOLHER VÍDEOS

<input
id="p1"
type="file"
accept="video/*"
multiple
>

</label>

<div id="f1"></div>

</div>

<div class="card">

<h3>2 — Desenvolvimento</h3>

<label class="drop">

＋ ESCOLHER VÍDEOS

<input
id="p2"
type="file"
accept="video/*"
multiple
>

</label>

<div id="f2"></div>

</div>

<div class="card">

<h3>3 — CTA</h3>

<label class="drop">

＋ ESCOLHER VÍDEOS

<input
id="p3"
type="file"
accept="video/*"
multiple
>

</label>

<div id="f3"></div>

</div>

<div class="card">

<div
class="count"
id="count"
>
0 combinações
</div>

<select id="limit">

<option value="1">
TESTE — 1 vídeo
</option>

<option value="10">
10 vídeos
</option>

<option value="30">
30 vídeos
</option>

</select>

<button
id="generate"
>
🔥 GERAR CRIATIVOS
</button>

<div class="progress">

<div
id="bar"
class="bar"
></div>

</div>

<p
id="status"
class="status"
>
Escolha um vídeo em cada etapa.
</p>

</div>

<div class="card">

<h3>Vídeos gerados</h3>

<div id="links">

<span class="status">
Nenhum vídeo gerado.
</span>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/umd/index.js"></script>

<script>

"use strict";

const partes = [
  [],
  [],
  []
];

const $ = id =>
  document.getElementById(id);


/* ===============================
   FFmpeg
================================ */

let ffmpeg = null;

let ffmpegCarregado = false;


async function carregarFFmpeg(){

  if(ffmpegCarregado){
    return;
  }

  $("status").textContent =
    "Carregando mecanismo de vídeo...";


  if(
    typeof FFmpeg === "undefined"
  ){

    throw new Error(
      "Não foi possível carregar o FFmpeg."
    );

  }



  const FFmpegClass =
    window.FFmpegWASM &&
    window.FFmpegWASM.FFmpeg;

if(!FFmpegClass){

  throw new Error(
    "FFmpeg não foi carregado corretamente."
  );

}

ffmpeg =
    new FFmpegClass();


  ffmpeg.on(
    "progress",
    ({ progress }) => {

      $("bar").style.width =
        Math.round(progress * 100) +
        "%";

    }
  );


  ffmpeg.on(
    "log",
    ({ message }) => {

      console.log(
        "FFmpeg:",
        message
      );

    }
  );



  const baseURL =
  "https://cdn.jsdelivr.net/npm/@ffmpeg/core-mt@0.12.6/dist/esm";

const toBlobURL =
  window.FFmpegUtil.toBlobURL;

const coreURL =
  await toBlobURL(
    baseURL + "/ffmpeg-core.js",
    "text/javascript"
  );

const wasmURL =
  await toBlobURL(
    baseURL + "/ffmpeg-core.wasm",
    "application/wasm"
  );

const workerURL =
  await toBlobURL(
    baseURL + "/ffmpeg-core.worker.js",
    "text/javascript"
  );

await ffmpeg.load({
  coreURL,
  wasmURL,
  workerURL,
  classWorkerURL: workerURL
});


  ffmpegCarregado = true;


  $("status").textContent =
    "Mecanismo de vídeo carregado.";

}


/* ===============================
   SELEÇÃO DOS VÍDEOS
================================ */

[1,2,3].forEach(
  numero => {

    $("p" + numero)
      .addEventListener(
        "change",
        evento => {

          partes[numero - 1] =
            [
              ...evento.target.files
            ];


          $("f" + numero)
            .innerHTML =

              partes[numero - 1]
                .map(
                  (arquivo, indice) =>

                    `<div class="file">
                      ${indice + 1}.
                      ${arquivo.name}
                    </div>`
                )
                .join("");


          atualizarContador();

        }
      );

  }
);


/* ===============================
   CONTADOR
================================ */

function atualizarContador(){

  const total =

    partes[0].length *
    partes[1].length *
    partes[2].length;


  $("count").textContent =

    total.toLocaleString(
      "pt-BR"
    ) +

    " combinações";

}


/* ===============================
   COMBINAÇÕES
================================ */

function criarCombinacoes(){

  const resultado = [];


  for(
    const gancho
    of partes[0]
  ){

    for(
      const desenvolvimento
      of partes[1]
    ){

      for(
        const cta
        of partes[2]
      ){

        resultado.push([
          gancho,
          desenvolvimento,
          cta
        ]);

      }

    }

  }


  return resultado;

}

  </script>
  <script>

async function gravarCriativo(
  arquivos,
  numero
){

  $("status").textContent =
    "Preparando criativo " +
    numero +
    "...";


  /* =========================
     CONVERTER OS 3 VÍDEOS
  ========================= */

  const convertidos =
    await prepararVideos(
      arquivos
    );


  /* =========================
     TESTAR OS VÍDEOS
  ========================= */

  for(
    let i = 0;
    i < convertidos.length;
    i++
  ){

    $("status").textContent =
      "Testando vídeo " +
      (i + 1) +
      " de 3...";


    await testarVideo(
      convertidos[i]
    );

  }


  /* =========================
     CARREGAR OS VÍDEOS
  ========================= */

  const videos = [];


  try{

    for(
      const arquivo
      of convertidos
    ){

      const video =
        document.createElement(
          "video"
        );


      const url =
        URL.createObjectURL(
          arquivo
        );


      video.src =
        url;

      video.preload =
        "auto";

      video.muted =
        true;

      video.playsInline =
        true;

      video.setAttribute(
        "playsinline",
        ""
      );


      await new Promise(
        (resolve,reject) => {

          video.onloadeddata =
            resolve;

          video.onerror =
            () =>
              reject(
                new Error(
                  "Erro ao carregar vídeo convertido."
                )
              );

          video.load();

        }
      );


      videos.push({
        video: video,
        url: url
      });

    }


    /* =========================
       CANVAS
    ========================= */

    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      1080;

    canvas.height =
      1920;


    const contexto =
      canvas.getContext(
        "2d"
      );


    /* =========================
       STREAM
    ========================= */

    const stream =
      canvas.captureStream(
        30
      );


    /* =========================
       ÁUDIO
    ========================= */

    let audioContext =
      null;


    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if(AudioContext){

        audioContext =
          new AudioContext();


        const destino =
          audioContext
            .createMediaStreamDestination();


        for(
          const item
          of videos
        ){

          try{

            const fonte =
              audioContext
                .createMediaElementSource(
                  item.video
                );


            fonte.connect(
              destino
            );

          }catch(e){

            console.log(
              "Áudio não conectado:",
              e
            );

          }

        }


        destino.stream
          .getAudioTracks()
          .forEach(
            trilha =>
              stream.addTrack(
                trilha
              )
          );


        if(
          audioContext.state ===
          "suspended"
        ){

          await audioContext.resume();

        }

      }

    }catch(e){

      console.log(
        "Áudio indisponível:",
        e
      );

    }


    /* =========================
       MEDIA RECORDER
    ========================= */

    const mime =
      "video/webm";


    if(
      !window.MediaRecorder
    ){

      throw new Error(
        "Seu navegador não suporta gravação de vídeo."
      );

    }


    const gravador =
      new MediaRecorder(
        stream,
        {
          mimeType: mime,
          videoBitsPerSecond:
            7000000
        }
      );


    const partesGravadas =
      [];


    gravador.ondataavailable =
      evento => {

        if(
          evento.data &&
          evento.data.size > 0
        ){

          partesGravadas.push(
            evento.data
          );

        }

      };


    const finalizado =
      new Promise(
        (resolve,reject) => {

          gravador.onstop =
            resolve;


          gravador.onerror =
            () =>
              reject(
                new Error(
                  "Erro durante a gravação."
                )
              );

        }
      );


    gravador.start(
      500
    );


    /* =========================
       JUNTAR OS 3 VÍDEOS
    ========================= */

    for(
      let parte = 0;
      parte < videos.length;
      parte++
    ){

      const video =
        videos[parte].video;


      video.currentTime =
        0;


      $("status").textContent =
        "Criativo " +
        numero +
        " — parte " +
        (parte + 1) +
        " de 3";


      await video.play();


      while(
        !video.ended
      ){

        const largura =
          video.videoWidth;


        const altura =
          video.videoHeight;


        const proporcaoVideo =
          largura /
          altura;


        const proporcaoCanvas =
          1080 /
          1920;


        let larguraFinal;
        let alturaFinal;
        let x;
        let y;


        if(
          proporcaoVideo >
          proporcaoCanvas
        ){

          alturaFinal =
            1920;


          larguraFinal =
            alturaFinal *
            proporcaoVideo;


          x =
            (1080 -
              larguraFinal) /
            2;


          y =
            0;

        }else{

          larguraFinal =
            1080;


          alturaFinal =
            larguraFinal /
            proporcaoVideo;


          x =
            0;


          y =
            (1920 -
              alturaFinal) /
            2;

        }


        contexto.fillStyle =
          "#000";


        contexto.fillRect(
          0,
          0,
          1080,
          1920
        );


        contexto.drawImage(
          video,
          x,
          y,
          larguraFinal,
          alturaFinal
        );


        await new Promise(
          resolve =>
            requestAnimationFrame(
              resolve
            )
        );

      }


      video.pause();

    }


    /* =========================
       FINALIZAR
    ========================= */

    gravador.stop();


    await finalizado;


    if(audioContext){

      try{

        await audioContext.close();

      }catch(e){}

    }


    for(
      const item
      of videos
    ){

      item.video.pause();

      URL.revokeObjectURL(
        item.url
      );

    }


    return new Blob(
      partesGravadas,
      {
        type:
          "video/webm"
      }
    );


  }catch(erro){

    for(
      const item
      of videos
    ){

      try{

        item.video.pause();

        URL.revokeObjectURL(
          item.url
        );

      }catch(e){}

    }


    throw erro;

  }

}

  </script>

  <script>

/* ===============================
   BOTÃO GERAR
================================ */

$("generate").addEventListener(
  "click",
  async () => {

    if(
      partes[0].length === 0 ||
      partes[1].length === 0 ||
      partes[2].length === 0
    ){

      alert(
        "Escolha pelo menos 1 vídeo em cada etapa."
      );

      return;

    }


    $("generate").disabled =
      true;


    $("links").innerHTML =
      "";


    $("bar").style.width =
      "0%";


    try{

      /* =========================
         CARREGAR FFmpeg
      ========================= */

      await carregarFFmpeg();


      /* =========================
         CRIAR COMBINAÇÕES
      ========================= */

      const todas =
        criarCombinacoes();


      const limite =
        Number(
          $("limit").value
        );


      const combinacoes =
        todas.slice(
          0,
          limite
        );


      /* =========================
         PROCESSAR
      ========================= */

      for(
        let i = 0;
        i < combinacoes.length;
        i++
      ){

        $("status").textContent =
          "Gerando criativo " +
          (i + 1) +
          " de " +
          combinacoes.length +
          "...";


        const blob =
          await gravarCriativo(
            combinacoes[i],
            i + 1
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            "a"
          );


        link.href =
          url;


        link.download =
          "criativo_" +
          String(
            i + 1
          ).padStart(
            3,
            "0"
          ) +
          ".webm";


        link.textContent =
          "⬇️ Baixar criativo " +
          String(
            i + 1
          ).padStart(
            3,
            "0"
          );


        $("links")
          .appendChild(
            link
          );


        $("bar").style.width =
          (
            (
              (i + 1) /
              combinacoes.length
            ) *
            100
          ) +
          "%";

      }


      $("status").textContent =
        "✅ Concluído! " +
        combinacoes.length +
        " criativo(s) gerado(s).";


    }catch(erro){

      console.error(
        erro
      );


      $("status").textContent =
        "❌ ERRO: " +
        (
          erro.message ||
          erro
        );

    }


    $("generate").disabled =
      false;

  }
);

</script>
